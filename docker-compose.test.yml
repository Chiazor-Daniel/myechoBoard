# Local test stack: single self-contained myechoBoard container.
# The image bundles the Ollama daemon and an authenticated Ollama Cloud
# session, so nothing on the host is required.

services:
  echoboard:
    image: buzz3r/echoboard:latest
    container_name: echoboard-test
    restart: "no"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      AI_PROVIDER: ollama
      OLLAMA_HOST: http://localhost:11434
      OLLAMA_MODEL: gemma4:31b-cloud
      PENECHO_AI_IMAGE_FORMAT: png
      AI_TIMEOUT_SECONDS: 300
      AUTO_AI_DELAY_SECONDS: 5
      PENECHO_REQUEST_TRACE: false
      PENECHO_FRAME_ANCESTORS: "http://localhost:9000 https://myecho.edustartech.com/"
      PENECHO_LOCAL_ACCESS_MODE: open
    ports:
      - "8080:8080"