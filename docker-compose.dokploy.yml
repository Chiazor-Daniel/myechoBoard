# Dokploy / Docker Compose stack for myechoBoard.
#
# Single self-contained service: the image bundles the Ollama daemon and an
# authenticated Ollama Cloud session, so no separate Ollama container and no
# host ~/.ollama directory are required. The embedded entrypoint starts
# `ollama serve` on localhost and registers OLLAMA_MODEL before the app boots.

services:
  echoboard:
    image: buzz3r/echoboard:latest
    container_name: echoboard
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      AI_PROVIDER: ollama
      OLLAMA_HOST: http://localhost:11434
      OLLAMA_MODEL: gemma4:31b-cloud
      PENECHO_AI_IMAGE_FORMAT: png
      AI_TIMEOUT_SECONDS: 300
      AUTO_AI_DELAY_SECONDS: 5
      PENECHO_REQUEST_TRACE: false
      # Origins allowed to embed myechoBoard in an iframe.
      PENECHO_FRAME_ANCESTORS: https://myecho.edustartech.com/
      PENECHO_LOCAL_ACCESS_MODE: open
    ports:
      - "8080:8080"